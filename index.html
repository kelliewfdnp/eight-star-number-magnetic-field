function elHTML(){return `<h2>Digit elements <span class="z">数字五行</span></h2><div class="sb">Tap an element to see its digits. Set your 喜用之神 and 忌凶之神 to ring them here and highlight matching pairs in Star Tables.<span class="zl">点击五行查看数字。设定喜用之神与忌凶之神后，此处会加圈标示，星表中含有这些数字的数字组也会被标出。</span></div>
<div class="leg">${ELS.map(e=>`<div class="${EL.x.includes(e)?'fx':EL.j.includes(e)?'jx':''}" style="--e:var(${EC[e]})" onclick="say('${e} ${EN[e]}: digits 数字 ${ELD[e]}${EL.x.includes(e)?' · 喜用 favourable':EL.j.includes(e)?' · 忌凶 unfavourable':''}')">${EL.x.includes(e)?'<b class="wm">喜</b>':EL.j.includes(e)?'<b class="wm">忌</b>':''}${e}<em>${EN[e]}</em><span>${ELD[e]}</span></div>`).join('')}</div>
<div class="sb" style="margin:14px 0 0"><b>喜用之神</b> Favourable elements (green ring)</div><div class="ft x">${ELS.map(e=>`<button class="${EL.x.includes(e)?'on':''}" onclick="setEL('x','${e}')">${e} ${EN[e]}</button>`).join('')}</div>
<div class="sb" style="margin:0"><b>忌凶之神</b> Unfavourable elements — inauspicious digits (red ring)</div><div class="ft j">${ELS.map(e=>`<button class="${EL.j.includes(e)?'on':''}" onclick="setEL('j','${e}')">${e} ${EN[e]}</button>`).join('')}</div>`}
const EN={水:'Water',火:'Fire',木:'Wood',金:'Metal',土:'Earth'};
const tabs=['Number Lab 号码分析','Star Tables 星表','Star Guide 星曜详解'];let cur=0;
function nav(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i==cur?'on':''}" onclick="cur=${i};nav();R()">${i+1}. ${t}</button>`).join('')}
function R(){info.style.display='none';[lab,tb,gd][cur]();scrollTo(0,0)}
let QB='';
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'[]');localStorage.setItem(k,JSON.stringify(v))}catch(e){return[]}};
let EL=(()=>{const o=LS('nc_el');return o&&!Array.isArray(o)?{x:o.x||[],j:o.j||[]}:{x:[],j:[]}})();
function tl(n){const ps=n.length>1?pairs(n).map(pr):[],c={};let h=0;ps.forEach(r=>{if(r.hid)h++;else c[r.s.z]=(c[r.s.z]||0)+1});
const sum=g=>S.filter(s=>(s.r>0)==g).reduce((x,s)=>x+(c[s.z]||0),0);return{ps,c,h,good:sum(true),bad:sum(false)}}
function tallyHTML(n){const t=tl(n);if(!t.ps.length)return '';
return `<div class="sb" style="margin:12px 0 0">Tally 统计</div>`+[...S].sort((a,b)=>b.r-a.r).filter(s=>t.c[s.z]).map(s=>`<span class="tp" style="--c:${s.col}">${s.z} ×${t.c[s.z]}</span>`).join('')+(t.h?`<span class="tp" style="--c:#94a3b8">隐 ×${t.h}</span>`:'')}
const strip=n=>pairs(n).map(p=>`<i style="--c:${pr(p).col}"></i>`).join('');
function lab(){
v.innerHTML=`<div class="card"><h2>Key in any number <span class="z">输入任意号码</span></h2><div class="sb">Type digits to see each adjacent pair.<span class="zl">输入数字，查看每组相邻数字。</span></div><input id="q" inputmode="numeric" placeholder="e.g. 88613043" value="${QV}" oninput="an(this.value)" onchange="sv(this.value)"><div class="pairs" id="o"></div><div id="t1"></div></div>
<div class="card"><h2>Compare with another number <span class="z">对比另一个号码</span></h2><div class="sb">Key in a second number to compare the two.<span class="zl">输入第二个号码，对比两者。</span></div><input id="q2" inputmode="numeric" placeholder="e.g. 91421358" value="${QB}" oninput="an2(this.value)" onchange="sv(this.value)"><div class="pairs" id="o2"></div><div id="t2"></div><div id="cmp"></div></div>
<div class="card"><div class="sh"><h2>History <span class="z">历史记录</span></h2><button class="mb" onclick="clr()">Clear all 清除全部</button></div><div class="sb">Saved on this device when you tap away from the box. Load a number into A or B.<span class="zl">离开输入框时自动保存在本设备。可载入到 A 或 B。</span></div><div id="hist"></div></div>
<div class="card" id="eld">${elHTML()}</div>
<div class="card" id="spw"></div>
<div class="card"><h2>The ladder <span class="z">星曜强弱</span></h2><div class="sb" style="margin:0">Order of strength within the stars 星的强弱顺序：<br><b>Auspicious / 吉星:</b> 伏位 &lt; 生气 &lt; 天医 &lt; 延年<br><b>Inauspicious / 凶星:</b> 六煞 &lt; 祸害 &lt; 五鬼 &lt; 绝命</div></div>`;
an(QV);an2(QB);hist()}
function an(x){x=x.replace(/\D/g,'');QV=x;document.getElementById('o').innerHTML=x.length>1?pairs(x).map(pc).join(''):'';document.getElementById('t1').innerHTML=tallyHTML(x);spec();cmp()}
function an2(x){x=x.replace(/\D/g,'');QB=x;document.getElementById('o2').innerHTML=x.length>1?pairs(x).map(pc).join(''):'';document.getElementById('t2').innerHTML=tallyHTML(x);cmp()}
function cmp(){const el=document.getElementById('cmp');if(!el)return;if(QV.length<2||QB.length<2){el.innerHTML='';return}
const a=tl(QV),b=tl(QB),cell=(n,c)=>`<div class="cc ${n?'on':''}" style="--c:${c}">${n||'–'}</div>`;
const row=(lab,x,y,c,dot)=>`<div class="nm2">${dot?`<span class="dot" style="--c:${c}"></span>`:''}${lab}</div>${cell(x,c)}${cell(y,c)}`;
el.innerHTML=`<div class="sb" style="margin:14px 0 0">Comparison 对比</div><div class="ct"><div></div><div class="hd">A<br>${QV}</div><div class="hd">B<br>${QB}</div>
${row('吉 Auspicious pairs',a.good,b.good,'#2f8f68')}${row('凶 Inauspicious pairs',a.bad,b.bad,'#c8503c')}${row('隐 Hidden pairs',a.h,b.h,'#94a3b8')}
${[...S].sort((p,q)=>q.r-p.r).filter(s=>a.c[s.z]||b.c[s.z]).map(s=>row(s.z+' '+s.en,a.c[s.z]||0,b.c[s.z]||0,s.col,1)).join('')}</div>`}
function hist(){const el=document.getElementById('hist');if(!el)return;const H=LS('nc_hist');
el.innerHTML=H.length?H.map((n,i)=>`<div class="hi"><b>${n}</b><span class="strip">${strip(n)}</span><button class="mb" onclick="ld('A',${i})">A</button><button class="mb" onclick="ld('B',${i})">B</button><button class="mb" onclick="del(${i})">×</button></div>`).join(''):'<div class="sb" style="margin:0">No numbers saved yet. 暂无记录。</div>'}
function sv(x){x=x.replace(/\D/g,'');if(x.length<2)return;LS('nc_hist',[x,...LS('nc_hist').filter(n=>n!=x)].slice(0,20));hist()}
function ld(w,i){const n=LS('nc_hist')[i];if(!n)return;if(w=='A'){document.getElementById('q').value=n;an(n)}else{document.getElementById('q2').value=n;an2(n)}scrollTo({top:0,behavior:'smooth'})}
function del(i){const H=LS('nc_hist');H.splice(i,1);LS('nc_hist',H);hist()}
function clr(){LS('nc_hist',[]);hist()}
function spec(){
const ps=QV.length>1?pairs(QV).map(pr):[],cnt={};ps.forEach(r=>{if(r.s)cnt[r.s.z]=(cnt[r.s.z]||0)+1});
const hid=ps.filter(r=>r.hid).length;
document.getElementById('spw').innerHTML=`<h2>Star spectrum <span class="z">星曜光谱</span></h2><div class="sb">Weakest to strongest on each side. A badge shows how many pairs of your number land on that star${hid?` (plus ${hid} hidden 隐 pair${hid>1?'s':''})`:''}. Tap to explore.<span class="zl">每侧由弱到强。角标显示号码中落在该星的数字组数${hid?`（另有 ${hid} 组隐）`:''}。点击查看。</span></div>
<div class="spec">${S.map(s=>`<button class="sp ${cnt[s.z]?'me':''}" style="--c:${s.col}" onclick="say('<b>${s.z}</b> ${s.en} · ${s.el} ${EN[s.el]}<br>${s.p.join(' · ')}')">${cnt[s.z]?`<span class="mk">${cnt[s.z]}</span>`:''}<span class="vz">${s.z}</span><small>${s.r>0?'+'+s.r:s.r}</small></button>`).join('')}</div>
<div class="axis"><span>◀ Most inauspicious 最凶</span><span>Most auspicious 最吉 ▶</span></div>`}
function col(g){return [...S].filter(s=>(s.r>0)==g).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).map(s=>`<div class="card sc" style="--c:${s.col}"><div class="sh"><h3>${s.z}<br>${s.en}</h3><span class="tag">${s.r>0?'+'+s.r:s.r}</span></div><div class="sb" style="margin:2px 0 0">Element 五行：${EN[s.el]} ${s.el}</div><div class="g2">${s.p.map((x,i)=>`<button class="ch ${s.r>0?'ya':'ra'}${hl(x,s.r>0)}" onclick="say('<b>${x}</b> = ${s.z} (${s.en}), ${s.el} ${EN[s.el]}${hl(x).includes('fv')?' · contains 喜用 digit':''}${hl(x).includes('av')?' · contains 忌凶 digit':''}')">${x}</button>`).join('')}</div></div>`)}
function tb(){
const kb=(EL.x.length||EL.j.length)?`<div class="kb">${EL.x.length?`<span class="kr kx">喜用 ${EL.x.join(' ')}</span>`:''}${EL.j.length?`<span class="kr kj">忌凶 ${EL.j.join(' ')}</span>`:''}<br>Ringed pairs contain those elements' digits (green = favourable, red = unfavourable; red wins if a pair has both). 带圈数字组含有对应五行的数字。</div>`:`<div class="kb">Tip: set 喜用之神 / 忌凶之神 under Digit elements in tab 1 to highlight matching pairs here.</div>`;
v.innerHTML=kb+`<div class="cols"><div class="ch2" style="background:#2f8f68">四吉星 Auspicious</div><div class="ch2" style="background:#c8503c">四凶星 Inauspicious</div>${(()=>{const A=col(true),B=col(false);return A.map((x,i)=>x+B[i]).join('')})()}</div><div class="note" style="color:var(--mut)">Strongest star first in each column.</div>`}
const G={
延年:{r:['Career, leadership and health','事业、领导力与健康'],s:['Strong professional ability; good at preserving wealth','专业能力强，善于守财'],w:['Stubborn, domineering, stressed and overworked','固执、强势、压力大、劳碌']},
天医:{r:['Wealth, marriage and wisdom','财富、婚姻与智慧'],s:['Naturally kind; good regular income','天性善良，正财运佳'],w:['Innocent nature can make one gullible and easily deceived','单纯易轻信他人而被骗']},
生气:{r:['Benefactors, popularity and optimism','贵人、人缘与乐观'],s:['Cheerful and easily receives help','心态开朗，易得帮助'],w:['May lack drive (too easy-going) and spend too freely','过于随缘而缺乏行动力，花钱大方难守财']},
伏位:{r:['Waiting, accumulation and stability','等待、积蓄与稳定'],s:['Patient and persistent','极具耐心与毅力'],w:['Overly conservative and passive; insecurity often means missed opportunities','过于保守被动，缺乏安全感而错失时机']},
绝命:{r:['Investment, financial loss and drastic ups and downs','投资、破财与大起大落'],s:['Bold and action-oriented','敢拼敢闯，行动力强'],w:['Impulsive and irritable; unstable emotions and finances','易冲动暴躁，情绪与财务均不稳定']},
五鬼:{r:['Change, talent and instability','变动、才华与不稳定'],s:['Quick-thinking and resourceful','思维敏捷、反应快、计谋多'],w:['Fickle; prone to unrest or setbacks','想法多变，易有不安定感或遭遇波折']},
六煞:{r:['Romantic entanglements, interpersonal complications and fashion','偏桃花、人际纠葛与时尚'],s:['Sociable with good romantic luck','异性缘好，善于交际'],w:['Emotional and indecisive; often troubled by relationships','情绪化、优柔寡断，常为感情或人际关系所困']},
祸害:{r:['Speech, gossip/conflict and illness','口才、口舌是非与病痛'],s:['Eloquent; can make a living by speaking','能说会道，可靠口才谋生'],w:['Prone to trouble from words, petty people or arguments','易因言惹祸，招惹小人或引发争执']}};
function gd(){
const grp=g=>[...S].filter(x=>(x.r>0)==g).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r)).map(x=>{const d=G[x.z];return `<div class="card sc g" style="--c:${x.col}"><div class="sh"><h3>${x.z}<br>${x.en}</h3><span class="tag">${x.r>0?'+'+x.r:x.r}</span></div><div class="sb" style="margin:3px 0 0">Element 五行：${EN[x.el]} ${x.el}</div>${[['r','Represents 代表','l-r'],['s','Strength 优点','l-s'],['w','Weakness 缺点','l-w']].map(([k,l,c])=>`<div class="gr"><span class="gl2 ${c}">${l}</span><div>${d[k][0]}</div><div>${d[k][1]}</div></div>`).join('')}</div>`}).join('');
v.innerHTML=`<div class="sb" style="margin-bottom:10px">Core meaning and traits of each star.<span class="zl">每颗星的核心含义与特质。</span></div><div class="ch2" style="background:#2f8f68;margin-bottom:10px">四吉星 Auspicious Stars</div>${grp(true)}<div class="ch2" style="background:#c8503c;margin:4px 0 10px">四凶星 Inauspicious Stars</div>${grp(false)}`}
const v=document.getElementById('v');nav();R();
function tick(){const d=new Date();document.getElementById('clk').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' ('+d.toLocaleDateString('zh-CN',{weekday:'short'})+') · '+d.toLocaleTimeString('en-GB')}
tick();setInterval(tick,1000);
</script></body></html>
