      ${pillar('ys','yb','年柱','Year')}
      ${pillar('ms','mb','月柱','Month')}
      ${pillar('ds','db','日柱','Day',true)}
      ${pillar('hs','hb','时柱','Hour')}
    </div></div>`;

  const birth=`<div class="card"><h2>Birth date &amp; time <span class="z">出生日期时间</span></h2>
    <div class="sb">Enter the birth details to fill the four pillars below. Clock time is used as entered, with no solar-time correction.<span class="zl">按所填钟表时间排盘，未作真太阳时校正；23:00 起按次日子时。</span></div>
    <div class="bin">
      <label class="gd${B.d?'':' empty'}">Date 日期<input type="date" value="${B.d}" onchange="bzBirth('d',this.value);this.parentNode.classList.toggle('empty',!this.value)"></label>
      <label class="gd">Time 时间<input type="time" value="${B.t}" onchange="bzBirth('t',this.value)"></label>
      <label class="bw">Time zone 时区<select onchange="bzBirth('z',this.value)">${ZONES.map(z=>`<option value="${z[0]}"${z[0]===B.z?' selected':''}>${z[1]}</option>`).join('')}</select></label>
    </div>
    <button class="bgo" onclick="bzCalc()">Calculate pillars 排盘</button>
    ${B.msg?`<div class="bmsg">${B.msg}</div>`:''}
    <div class="bnote" style="margin-top:8px">Solar terms are calculated (accurate to about 15 minutes); verify births very close to a term boundary.<br>节气以公式推算，误差约 15 分钟内。</div></div>`;
  // 强弱结论
  const verdict=`<div class="card hero bzh ${r.strong?'str':'wk'}" data-el="${r.dmEl}" style="--e:var(${EC[r.dmEl]})"><div class="bd bzlab"><span>Day Master 日主 · ${r.dm}${r.dmEl} ${EN[r.dmEl]}</span>${icon(r.dmEl)}</div>
    <div class="bbig">${r.strong?'身强':'身弱'}</div>
    <div class="bsub">${r.strong?'Strong Day Master — needs draining / control 需克制消耗':'Weak Day Master — needs support / backing 需帮扶'}</div>
    <div class="bexp">${r.strong?'This chart is Strong (身强). Output, Wealth &amp; Power are your <b class="tg-s">[+ Balance]</b> elements, while Peer &amp; Resource are your <b class="tg-d">[- Overload]</b> elements.':'This chart is Weak (身弱). Peer &amp; Resource are your <b class="tg-s">[+ Support]</b> elements, while Output, Wealth &amp; Power are your <b class="tg-d">[- Drain]</b> elements.'}</div></div>`;

  // 分数条
  const bars=`<div class="card"><h2>Strength score <span class="z">强弱打分</span></h2>
    <button class="bzi" onclick="bzInfo()">Click <u>here</u> for more information</button>
    <div class="sb">Support vs Drain → Total 100 points<span class="zl"><span class="sdp sup">帮扶（同我 · 生我）</span><span class="sdv">vs</span><span class="sdp drn">消耗（我生 · 我克 · 克我）</span></span><span class="zl">满分 100 点 · 日元不计分</span></div>
    <div class="bars">
      <div class="barrow"><div class="bnm sup">帮扶 Support<small>同我 · 生我</small></div><div class="bbar"><i class="i-sup" style="width:${supPct}%"></i></div><div class="bsc sup">${r.sup}</div></div>
      <div class="barrow"><div class="bnm drn">消耗 Drain<small>我生 · 我克 · 克我</small></div><div class="bbar"><i class="i-drn" style="width:${drnPct}%"></i></div><div class="bsc drn">${r.drn}</div></div>
    </div></div>`;

  // 明细表
  const rowsA=r.positions.map(p=>{
    const hid=BRANCHES[p.ch]?BRANCHES[p.ch].hid.map(h=>`<div style="margin-top:3px;font-size:11px;color:var(--mut)">${h} · ${tenGod(r.dm,h)}</div>`).join(''):'';
    return `<tr>
      <td><div class="l1"><b>${p.label}</b></div><small style="color:var(--mut)">${p.en}</small></td>
      <td><div class="l1"><span class="elchip" style="--e:var(${EC[p.el]})">${p.ch} ${p.el}</span></div>${hid}</td>
      <td><div class="l1"><span class="rel r-${p.rel}">${REL[p.rel].zh}</span></div><small style="color:var(--mut)">${p.ten}</small></td>
      <td style="text-align:center;font-weight:700"><div class="l1" style="justify-content:center">${p.w}</div></td>
      <td style="text-align:center" class="${REL[p.rel].sup?'sup':'drn'}"><div class="l1" style="justify-content:center">${REL[p.rel].sup?'+ 帮扶':'− 消耗'}</div></td>
    </tr>`;
  });
  // 日元 (Day Master): shown for reference, not scored — sits between 月令 and 日支
  rowsA.splice(4,0,`<tr class="dmrow">
      <td><div class="l1"><b>日元</b></div><small style="color:var(--mut)">Day Master</small></td>
      <td><div class="l1"><span class="elchip" style="--e:var(${EC[r.dmEl]})">${r.dm} ${r.dmEl}</span></div></td>
      <td><div class="l1"><span class="rel r-dm">日元</span></div><small style="color:var(--mut)">自己 Self</small></td>
      <td style="text-align:center;font-weight:700"><div class="l1" style="justify-content:center;color:var(--mut)">—</div></td>
      <td style="text-align:center;color:var(--mut)"><div class="l1" style="justify-content:center">参照 不计分</div></td>
    </tr>`);
  const rows=rowsA.join('');
  const detail=`<div class="card"><h2>Breakdown <span class="z">逐项明细</span></h2>
    <div class="sb">Each position's element, Ten-Gods relation, and weight. The Day Master (日元) row is the reference point and is not scored. Branch hidden stems (藏干) are listed for reference.<span class="zl">各位置五行、十神关系与权重；地支藏干仅供参考。</span></div>
    <table class="bzt"><thead><tr><th>位置</th><th>干支 · 五行</th><th>关系 · 十神</th><th style="text-align:center">权重</th><th style="text-align:center">归类</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  // 旺相休囚死
  const ORDER=['wang','xiang','xiu','qiu','si'];
  const sp=t=>{const k=t.indexOf(' ');return [t.slice(0,k),t.slice(k+1)]};
  const wx=ORDER.map(k=>{
    const el=WXQS[r.seasonEl][k],sd=STATUS[k],[tz]=sp(sd.tr);
    return `<div style="--e:var(${EC[el]})"><b class="wm">${sd.zh}</b>${el}<span>${tz}</span></div>`;
  }).join('');
  const wdesc=ORDER.map(k=>{
    const el=WXQS[r.seasonEl][k],sd=STATUS[k],[tz,te]=sp(sd.tr);
    return `<div class="wr"><i style="background:var(${EC[el]})"></i><span><b>${el} ${EN[el]}</b> · ${sd.zh} ${sd.en} — ${tz} ${te}</span></div>`;
  }).join('');
  const wxqs=`<div class="card"><h2>Seasonal status <span class="z">旺相休囚死</span></h2>
    <div class="sb">Season = Month Branch (月令) ${S.mb} · ${r.seasonEl} ${EN[r.seasonEl]}. Ordered 旺 → 相 → 休 → 囚 → 死.<span class="zl">以月令五行定四季，按 旺 → 相 → 休 → 囚 → 死 排列。</span></div>
    <div class="leg">${wx}</div><div class="wdesc">${wdesc}</div></div>`;

  // 喜用 / 忌神
  const favRel=r.strong?['iGenerate','iControl','controlMe']:['sameMe','generateMe'];
  const avRel=r.strong?['sameMe','generateMe']:['iGenerate','iControl','controlMe'];
  const rn=rel=>{const t=REL[rel].en,k=t.indexOf(' ');return {en:t.slice(0,k),cn:t.slice(k+1)}};
  const relChip=rel=>`<span class="bch" style="--rc:var(--line)">${REL[rel].zh}<small>${rn(rel).cn}</small></span>`;
  const elChip=el=>`<span class="elchip" style="--e:var(${EC[el]})">${el}</span>`;
  const relBlock=rels=>rels.map(rel=>`<div class="brb">${relChip(rel)}${r.relEls[rel].map(elChip).join('')}</div>`).join('');
  const RN={sameMe:'Peer (Companion)',generateMe:'Resource (Support)',iGenerate:'Output (Expression)',iControl:'Wealth (Possession)',controlMe:'Power (Authority)'};
  const TG={sameMe:'Friend / Rob Wealth',generateMe:'Direct / Indirect Resource',iGenerate:'Eating God / Hurting Officer',iControl:'Direct / Indirect Wealth',controlMe:'Direct Officer / Seven Killings'};
  const descLine=rels=>rels.map(rel=>`<div class="fi"><b>${RN[rel]} ${REL[rel].zh}</b><small>${TG[rel]}</small>→ ${r.relEls[rel].map(e=>EN[e]+' '+e).join(', ')}</div>`).join('');
  const favav=`<div class="card"><h2>Favorable &amp; Unfavorable <span class="z">喜用 · 忌凶</span></h2>
    <div class="sb">Favorable elements balance the chart; unfavorable ones tip it further.<span class="zl">喜用之神助命局平衡，忌凶之神加重偏颇。</span></div>
    <div class="fa">
      <div class="fv"><h3>喜用之神</h3>${relBlock(favRel)}</div>
      <div class="uv"><h3>忌凶之神</h3>${relBlock(avRel)}</div>
    </div>
    <div class="fd">
      <div style="--c:var(--fvr)"><h4>Favorable 喜用</h4>${descLine(favRel)}</div>
      <div style="--c:var(--avr)"><h4>Unfavorable 忌凶</h4>${descLine(avRel)}</div>
    </div></div>`;

  const note=`<div class="card"><div class="bnote">
    <b>Note 说明：</b>This implements the simplified fixed-weight teaching method from the reference lecture. The Day Stem (日元) is the reference point and carries no score; the remaining positions total 100 points. Branch scoring uses its main qi (本气); hidden stems are shown for reference. Classical Zi Ping BaZi additionally considers combinations, clashes, and hidden-stem priority, which this quick self-check does not model. For cultural reference only.
    <span class="zl">本工具采用参考课程中的简化固定打分法：日元为参照不计分，其余位置合计 100 分；地支以本气计分，藏干仅供参考。传统子平八字还需论合冲、藏干主次等，本速查未纳入，仅供文化参考。</span></div></div>`;

  return `<div class="bz">${birth+pillars+verdict+bars+detail+wxqs+favav+note}</div>`;
}

window.bzInfo=function(){
  const m=document.createElement('div');m.className='bzm';
  m.innerHTML=`<div class="bzb"><button class="bzx" aria-label="Close">✕</button><h3>The 5 Relationships (十神)</h3><ul>
  <li><b>Peer 同我:</b> Companions, siblings, and self-confidence.</li>
  <li><b>Resource 生我:</b> Support, mentors, education, and nourishment.</li>
  <li><b>Output 我生:</b> Self-expression, creativity, and communication.</li>
  <li><b>Wealth 我克:</b> Finances, assets, and management of resources.</li>
  <li><b>Power 克我:</b> Authority, career, discipline, and boundaries.</li></ul></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',esc)};
  const esc=e=>{if(e.key==='Escape')close()};
  m.addEventListener('click',e=>{if(e.target===m||e.target.classList.contains('bzx'))close()});
  document.addEventListener('keydown',esc);document.body.appendChild(m);
};
window.bzUpd=function(k,val){S[k]=val;bazi()};
window.bazi=function(){v.innerHTML=baziHTML()};

tick();setInterval(tick,1000);
